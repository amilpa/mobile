name: Builds
on: workflow_dispatch

# Declare default permissions as read only.
permissions: read-all

jobs:
  # Release APK talking to the production servers (lichess.org), signed with a personal keystore.
  #
  # Requires these repository secrets:
  #   KEYSTORE_BASE64    the .jks keystore file, base64 encoded
  #   KEYSTORE_PASSWORD  the keystore password
  #   KEY_ALIAS          the key alias inside the keystore
  #   KEY_PASSWORD       the key password (same as KEYSTORE_PASSWORD if not set separately)
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest
    # A native build that hangs should fail fast rather than hold a runner.
    timeout-minutes: 60
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 17
          distribution: temurin

      - name: Checkout mobile code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: >
          flutter build apk --release
          --target-platform android-arm64
          --dart-define=cronetHttpNoPlay=true
          --dart-define=LICHESS_HOST=lichess.org
          --dart-define=LICHESS_WS_HOST=socket.lichess.org

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lichess-mobile-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
